    <text y="270" fill="#858C95" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">DOI 10.5281/zenodo.19602728 · no silent damage</text>
  </g>
  <g transform="translate(740 48)" fill="none" stroke="#DDE0E3" stroke-width="1.5">
    <rect width="400" height="264" fill="#0B0D10" stroke="#262A30"/>
    <circle cx="200" cy="118" r="92" stroke="#2A3038"/>
    <circle cx="200" cy="118" r="72" stroke="#5A6A7A" opacity="0.9"/>
    <circle cx="200" cy="118" r="52" stroke="#8AA0B4" opacity="0.75"/>
    <circle cx="200" cy="118" r="32" stroke="#B8C8D8" opacity="0.55"/>
    <circle cx="200" cy="118" r="4" fill="#E8C36A" stroke="none"/>
