    <text y="100" fill="#F4F5F6" font-size="62" font-weight="760" letter-spacing="-2.2">RingSentry</text>
    <text y="148" fill="#A8ADB4" font-size="23">Safe 2D detector cleanup before analysis.</text>
    <path d="M0 176H500" stroke="#2A2E34"/>
    <g transform="translate(0 210)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
