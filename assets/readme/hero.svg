<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">RingSentry</title>
  <desc id="desc">Reproducible preprocessing and quality control for 2D diffraction detector images.</desc>
  <rect width="1200" height="360" rx="26" fill="#050607"/>
  <path d="M0 54H1200M700 0V360" stroke="#1C1F24"/>
  <g transform="translate(56 40)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
