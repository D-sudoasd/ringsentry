<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">RingSentry</title>
  <desc id="desc">Reproducible preprocessing and quality control for 2D diffraction detector images from SAXS, WAXS, SXRD, and GIWAXS.</desc>
  <rect width="1200" height="340" rx="28" fill="#0a0f18"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <text x="56" y="68" fill="#38bdf8" font-size="18" font-weight="700" letter-spacing="2">SAXS · WAXS · SXRD · GIWAXS</text>
    <text x="56" y="124" fill="#f8fafc" font-size="48" font-weight="800">RingSentry</text>
    <text x="56" y="170" fill="#94a3b8" font-size="22">Safe 2D detector preprocessing before analysis.</text>
    <text x="56" y="210" fill="#64748b" font-size="18">dark/flat · ROI/mask · QC · reports · Q tools</text>
    <text x="56" y="260" fill="#475569" font-size="16">二维衍射图预处理 · 尽量避免静默损坏 · 参数进日志</text>
    <text x="56" y="300" fill="#64748b" font-size="15">DOI 10.5281/zenodo.19602728 · MIT · Windows GUI</text>
  </g>
  <!-- detector ring proof -->
  <g transform="translate(720 50)">
    <rect width="420" height="240" rx="16" fill="#0f172a" stroke="#1e3a5f" stroke-width="2"/>
    <circle cx="210" cy="120" r="95" fill="none" stroke="#1e293b" stroke-width="18"/>
    <circle cx="210" cy="120" r="95" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
    <circle cx="210" cy="120" r="70" fill="none" stroke="#7dd3fc" stroke-width="1.5" opacity="0.5"/>
    <circle cx="210" cy="120" r="45" fill="none" stroke="#bae6fd" stroke-width="1" opacity="0.4"/>
    <circle cx="210" cy="120" r="4" fill="#fbbf24"/>
    <!-- ROI rect -->
    <rect x="130" y="50" width="160" height="140" fill="none" stroke="#a7f3d0" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="24" y="220" fill="#64748b" font-family="ui-monospace, monospace" font-size="13">preview → preflight → batch → run_report</text>
  </g>
</svg>
