name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.12", "3.13"]
    env:
      MPLBACKEND: Agg
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]"

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run static checks
        run: python -m ruff check .

      - name: Validate citation metadata
        run: cffconvert --validate -i CITATION.cff

      - name: Verify Tk is available on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @'
          import tkinter as tk

          root = tk.Tk()
          root.withdraw()
          root.update_idletasks()
          root.destroy()
          '@ | python -

      - name: Run tests
        run: python -m pytest -q

      - name: Run the reproducible core example
        run: >-
          python examples/minimal_preprocessing.py
          --output-dir "${{ runner.temp }}/ringsentry-example"

      - name: Build source and wheel distributions
        run: python -m build --outdir "${{ runner.temp }}/ringsentry-dist"
