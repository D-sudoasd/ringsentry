[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ringsentry"
version = "7.0.0"
description = "Reproducible preprocessing and QC for 2D diffraction detector images."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Delun Gong" },
]
keywords = [
    "2D diffraction",
    "SAXS",
    "WAXS",
    "SXRD",
    "GIWAXS",
    "image preprocessing",
    "materials science",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "imageio>=2.9",
    "tifffile>=2021.7",
    "matplotlib>=3.4",
    "sv-ttk>=2.0",
    "h5py>=3.0; python_version >= '3.8'",
    "scipy>=1.7",
    "Pillow>=9.0",
    "fabio>=2023.4",
]

[project.urls]
Homepage = "https://github.com/D-sudoasd/ringsentry"
Repository = "https://github.com/D-sudoasd/ringsentry"
Issues = "https://github.com/D-sudoasd/ringsentry/issues"
DOI = "https://doi.org/10.5281/zenodo.19602728"

[project.gui-scripts]
ringsentry = "main:main"
# Backward-compatible entry point for scripts created before the RingSentry rename.
2d-image-processor = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "gui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py38"
