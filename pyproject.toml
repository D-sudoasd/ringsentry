[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ringsentry"
version = "7.0.0"
description = "Reproducible preprocessing and QC for 2D diffraction detector images."
readme = "PACKAGE_README.md"
requires-python = ">=3.8"
# PEP 639's string form requires setuptools >=77.0.3, whose supported releases
# require Python >=3.9. Keep the legacy table while Python 3.8 remains supported.
license = { text = "MIT" }
authors = [
    { name = "Delun Gong" },
]
keywords = [
    "2D diffraction",
    "SAXS",
    "WAXS",
    "SXRD",
    "GIWAXS",
    "image preprocessing",
    "diffraction detector",
    "materials science",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "imageio>=2.9",
    "tifffile>=2021.7",
    "matplotlib>=3.4",
    "sv-ttk>=2.0",
    "h5py>=3.0; python_version >= '3.8'",
    "scipy>=1.7",
    "Pillow>=9.1",
    "fabio>=2023.4",
]

[project.optional-dependencies]
test = [
    "build>=1.2",
    "cffconvert>=2.0",
    "pytest>=7",
    "ruff>=0.5",
    "setuptools>=61.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/D-sudoasd/ringsentry"
Repository = "https://github.com/D-sudoasd/ringsentry"
Issues = "https://github.com/D-sudoasd/ringsentry/issues"
DOI = "https://doi.org/10.5281/zenodo.19602728"

[project.gui-scripts]
ringsentry = "main:main"
# Backward-compatible entry point for scripts created before the RingSentry rename.
2d-image-processor = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "gui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
# Keep CI focused on syntax errors, undefined names, and other high-confidence
# defects. Broader style modernization is intentionally outside the JOSS scope.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# This standalone generator bootstraps the repository root before local imports.
"paper/figures/make_figures.py" = ["E402"]
